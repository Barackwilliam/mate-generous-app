# Staging deployment on Render's FREE plan (no card needed).
# - The database is NOT created here: Render's free Postgres is deleted after 30 days.
#   Use a free Supabase Postgres instead and paste its connection string as DATABASE_URL.
# - Free web services sleep after 15 minutes idle and take ~1 minute to wake up.
# Real payments stay off (sandbox) until a gateway is chosen.

services:
  - type: web
    name: mate-generous-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        sync: false  # Render asks for it: the Supabase "Session pooler" connection string
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PAYMENT_CALLBACK_SECRET
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: mate-generous-api.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://mate-generous-api.onrender.com
      - key: PAYMENT_GATEWAY
        value: sandbox
      - key: ALLOW_SANDBOX_PAYMENTS
        value: "1"
