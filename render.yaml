# Staging deployment on Render's FREE plan (no card needed).
# - The database is NOT created here: Render's free Postgres is deleted after 30 days.
#   Use a free Supabase Postgres instead and paste its connection string as DATABASE_URL.
# - Free web services sleep after 15 minutes idle and take ~1 minute to wake up.
# Real payments stay off (sandbox) until a gateway is chosen.

services:
  - type: web
    name: mate-generous-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && (python manage.py createsuperuser --noinput || true) && python manage.py seed_sample_content --if-empty
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        sync: false  # Render asks for it: the Supabase "Session pooler" connection string
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PAYMENT_CALLBACK_SECRET
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: mate-generous-api.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://mate-generous-api.onrender.com
      # Supabase Storage (Dashboard → Storage → S3 Connection). Buckets:
      # media-public (Public bucket ON) for images, media-private (OFF) for audio.
      - key: SUPABASE_S3_ENDPOINT
        sync: false  # https://<project-ref>.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_PUBLIC_BUCKET
        value: media-public
      - key: SUPABASE_PRIVATE_BUCKET
        value: media-private
      # First admin account, created on deploy (free plan has no Shell).
      # Already exists → skipped. Change the password in the admin afterwards.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_FULL_NAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: PAYMENT_GATEWAY
        value: sandbox
      - key: ALLOW_SANDBOX_PAYMENTS
        value: "1"
